x-coverage:
  state: covered
  reason: null
  detail: >-
    Substack has a real, reachable agent surface — an official remote MCP server at
    https://mcp.substack.com/api/v1/mcp with full RFC 8414 / RFC 9728 OAuth discovery —
    even though it publishes no OpenAPI. The one wall hit was documentation: the
    Developer API reference article is linked from Substack's own API Terms of Use but
    is absent from the public Help Center index, its Zendesk API record returns 401, and
    support.substack.com answers non-browser clients with a Cloudflare JavaScript
    challenge, so the Developer API's exact auth header and error contract could not be
    read first-party.
  evidence:
    - url: https://mcp.substack.com/api/v1/mcp
      status: 401
    - url: https://mcp.substack.com/.well-known/oauth-protected-resource/api/v1/mcp
      status: 200
    - url: https://substack.com/.well-known/oauth-authorization-server
      status: 200
    - url: https://support.substack.com/hc/en-us/articles/45099095296916-Substack-Developer-API
      status: 403
    - url: https://support.substack.com/api/v2/help_center/en-us/articles/45099095296916.json
      status: 401
    - url: https://substack.com/openapi.json
      status: 404
  checked: '2026-08-13'
