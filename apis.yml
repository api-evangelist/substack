  - name: Substack RSS Feeds
    description: >-
      Per-publication public RSS feeds available at
      https://{publication}.substack.com/feed for syndication and read-only
      access to posts. RSS 2.0 with the content, dc, atom and itunes namespaces;
      no credential required. Podcast subscribers additionally receive a private
      per-subscriber feed whose contents depend on their subscription tier.
    humanURL: https://support.substack.com/hc/en-us/articles/360038239391-Is-there-an-RSS-feed-for-my-publication
    baseURL: https://{publication}.substack.com
