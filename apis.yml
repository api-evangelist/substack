apis:
  - name: Substack Developer API
    description: >-
      Narrowly scoped official API that returns public Substack profile data
      for a given LinkedIn handle. Access requires accepting the Developer
      API Terms of Use, applying via form, and generating a token from the
      Developer API section of account settings. Only profiles meeting
      Substack's authenticity thresholds are returned.
    humanURL: https://support.substack.com/hc/en-us/articles/45099095296916-Substack-Developer-API
    baseURL: https://substack.com
    tags:
      - Profile
      - LinkedIn
      - Read Only
      - Gated
    tags_raw:
      - Profile
      - LinkedIn
      - Read-Only
      - Gated
    properties:
      - type: Documentation
        url: https://support.substack.com/hc/en-us/articles/45099095296916-Substack-Developer-API
      - type: APIReference
        url: https://support.substack.com/hc/en-us/articles/45099095296916-Substack-Developer-API
      - type: TermsOfService
        name: Substack Developer API Terms of Use
        url: https://substack.com/api-tos
      - type: Authentication
        url: authentication/substack-authentication.yml
  - name: Substack MCP Server
    description: >-
      Official remote Model Context Protocol server that connects a Substack
      publication to an MCP-capable AI assistant (Claude, ChatGPT, Cursor). Read-only:
      it serves publication dashboard metrics, subscriber counts, revenue, post
      performance, traffic sources, retention and publication settings. It cannot
      publish posts, send Notes or modify the account, and cannot read profile or Notes
      activity. Authorization is OAuth 2.1 authorization-code with PKCE S256 against
      https://substack.com, scope mcp:read, with RFC 9728 protected resource metadata
      advertised in the endpoint's own 401 challenge. Connecting requires Admin role on
      a Bestseller publication.
    humanURL: https://support.substack.com/hc/en-us/articles/50834026608916-How-to-connect-Substack-to-your-AI-Assistant
    baseURL: https://mcp.substack.com/api/v1/mcp
    tags:
