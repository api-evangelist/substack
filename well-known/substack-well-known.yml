source: live GET of /.well-known/* across every Substack host in apis.yml
note: 'Substack serves RFC 8414 OAuth 2.0 Authorization Server Metadata from the root of every host on
  the substack.com apex (substack.com, mcp.substack.com, api.substack.com and publication subdomains all
  return the same document, all pointing at the single issuer https://substack.com). The RFC 9728 Protected
  Resource Metadata document for the official MCP server is served only by mcp.substack.com, at the path-suffixed
  location the MCP spec requires. The OpenID Connect discovery document is NOT at the RFC 8615 canonical
  path — it is served from /oauth/.well-known/openid-configuration, which is why the root /.well-known/openid-configuration
  probe 404s. No security.txt, no api-catalog, no ai-plugin.json and no agent card are served on any host.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
