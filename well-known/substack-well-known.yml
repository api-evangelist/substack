generated: '2026-08-13'
method: probed
source: live GET of /.well-known/* across every Substack host in apis.yml
note: >-
  Substack serves RFC 8414 OAuth 2.0 Authorization Server Metadata from the root
  of every host on the substack.com apex (substack.com, mcp.substack.com,
  api.substack.com and publication subdomains all return the same document, all
  pointing at the single issuer https://substack.com). The RFC 9728 Protected
  Resource Metadata document for the official MCP server is served only by
  mcp.substack.com, at the path-suffixed location the MCP spec requires. The
  OpenID Connect discovery document is NOT at the RFC 8615 canonical path — it is
  served from /oauth/.well-known/openid-configuration, which is why the root
  /.well-known/openid-configuration probe 404s. No security.txt, no api-catalog,
  no ai-plugin.json and no agent card are served on any host.
hosts:
  - https://substack.com
  - https://mcp.substack.com
  - https://api.substack.com
  - https://support.substack.com
  - https://on.substack.com
