note: >-
  Substack states that rate limits exist but publishes no number, no window, no scope
  and no header. Section 5 of the Developer API Terms of Use reads: "Your use of the
  API is subject to rate limits, quotas, and other technical restrictions as determined
  by Substack in its sole discretion. You agree not to circumvent or attempt to bypass
  such restrictions. Substack may modify, suspend, or terminate API access or limits at
  any time." That is a policy, not a limit — an integrator cannot size a workload
  against it, and an agent has no runtime signal to back off on.
