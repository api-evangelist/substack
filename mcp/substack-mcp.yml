authorization:
  model: OAuth 2.1 authorization-code + PKCE, per MCP authorization spec
  authorization_server: https://substack.com
  protected_resource_metadata: https://mcp.substack.com/.well-known/oauth-protected-resource/api/v1/mcp
  authorization_server_metadata: https://substack.com/.well-known/oauth-authorization-server
  required_scope: mcp:read
  dynamic_client_registration: https://substack.com/oauth/register
  pkce: S256
  bearer_methods: [header]
eligibility:
  note: >-
    Substack gates the connector, not the endpoint. The documented requirements are
    that the connecting user is an Admin on the publication and that the publication
    is a Bestseller publication. An ineligible publication returns an error at the
    consent step.
  admin_required: true
  publication_tier: Bestseller
capabilities:
  access: read-only
  documented_data:
    - publication dashboard metrics (subscriber counts, revenue)
    - post performance
    - traffic sources
    - paid subscriber retention
    - publication settings
  documented_exclusions:
    - cannot publish posts
    - cannot send Notes
    - cannot modify the account
    - cannot access profile data
    - cannot access Notes activity
tools:
  status: gated
  note: >-
    tools/list is authenticated. An anonymous JSON-RPC POST of
    {"jsonrpc":"2.0","id":1,"method":"tools/list"} to the endpoint returns HTTP 401
    with {"error":"missing_token"} and a WWW-Authenticate: Bearer challenge, so the
    real tool names and inputSchemas require an authenticated introspection against a
    Bestseller publication. Substack publishes no tool list in its documentation, so
    none is recorded here rather than guessed. The documented capability surface above
    is what the provider states the server can read.
  list: []
