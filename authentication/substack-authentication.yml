docs: https://support.substack.com/hc/en-us/articles/45099095296916-Substack-Developer-API
note: >-
  Substack has no OpenAPI, so this profile was not derived from a spec — it was read
  from the provider's live OAuth/OIDC discovery documents and from the WWW-Authenticate
  challenge the MCP endpoint returns. Two distinct auth models are in play and they do
  not share credentials: the Developer API uses a self-service bearer token minted in
  account settings after an approval process, while the MCP server uses full OAuth 2.1
  with dynamic client registration.
